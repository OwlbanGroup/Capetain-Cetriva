[tox]
# Multi-environment testing configuration
# Usage:
#   tox                        # run all environments
#   tox -e py310              # Python 3.10 tests only
#   tox -e lint               # lint checks only
#   tox -e mypy               # type checking only

envlist =
    lint,
    mypy,
    coverage,
    py310,
    py311,
    py312,

[testenv]
# Generic test environment
deps =
    -r requirements.txt
    -r requirements-dev.txt
    pytest
    pytest-timeout
setenv =
    TESTING = 1
    ACH_API_KEY = test-ci-key
    PYTHONWARNINGS = ignore
commands =
    python -m pytest -q --no-header

[testenv:lint]
description = Run linters (isort, flake8, pylint)
skip_install = true
deps =
    flake8>=7.0
    pylint>=3.0
    isort>=5.13
commands =
    python -m isort --check-only .
    python -m flake8
    python -m pylint --rcfile=.pylintrc *.py --disable=all --enable=W,E

[testenv:mypy]
description = Run mypy type checker
skip_install = true
deps =
    mypy>=1.8
    -r requirements.txt
commands =
    python -m mypy

[testenv:coverage]
description = Run tests with coverage report
skip_install = true
deps =
    -r requirements.txt
    -r requirements-dev.txt
    pytest
    pytest-cov>=5.0
    pytest-timeout>=2.3
setenv =
    TESTING = 1
    ACH_API_KEY = test-ci-key
    PYTHONWARNINGS = ignore
commands =
    python -m pytest --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml

[testenv:fast]
description = Fast test runner (TESTING mode, no torch)
deps =
    -r requirements.txt
    -r requirements-dev.txt
    pytest
    pytest-timeout
setenv =
    TESTING = 1
    ACH_API_KEY = test-ci-key
    PYTHONWARNINGS = ignore
commands =
    python run_tests_fast.py

[pytest]
# Reference to our pytest.ini for tox environments
