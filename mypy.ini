# Mypy configuration for Capetain Cetriva
# Run: python -m mypy <file> --follow-imports=skip
[mypy]
# Third-party libraries without bundled type stubs (torch, sklearn,
# yfinance, plaid, pynvml) are treated as Any rather than errors.
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-plaid.*]
ignore_missing_imports = True

[mypy-pynvml.*]
ignore_missing_imports = True

[mypy-nvidia_ml_py.*]
ignore_missing_imports = True
