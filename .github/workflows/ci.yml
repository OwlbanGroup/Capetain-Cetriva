name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly vulnerability rescan (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8 + pylint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: flake8
        run: python -m flake8 --count

      - name: pylint
        run: >
          python -m pylint
          account_routing_demo.py banking_utils.py ach_payments.py
          plaid_integration.py nvidia_integration.py
          generate_account_number.py get_routing_number.py
          validate_routing_number.py e2e_nvidia_blackwell_integration.py
          run_all_tests.py

      - name: mypy (source modules)
        run: >
          python -m mypy
          account_routing_demo.py banking_utils.py ach_payments.py
          plaid_integration.py nvidia_integration.py
          generate_account_number.py get_routing_number.py
          validate_routing_number.py e2e_nvidia_blackwell_integration.py
          run_all_tests.py
          --follow-imports=skip

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only PyTorch (much smaller than default wheel)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest

      - name: Run tests
        env:
          # Integration modules degrade gracefully without real credentials;
          # all external calls are mocked in the test suite.
          ACH_API_KEY: test-ci-key
        run: python -m pytest -q --no-header

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational while newly introduced: flip to blocking once any
    # reported advisories have been triaged or waived.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit
