[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Timeout: 120s for any single test (prevents hangs on heavy imports)
timeout = 120
timeout_method = thread

addopts =
    --no-header
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-config=.coveragerc
    --cov-fail-under=0

markers =
    slow: marks tests as slow
    integration: marks integration tests requiring external services
    requires_torch: tests that require real torch (skipped in TESTING mode)
    requires_plaid: tests that require real Plaid SDK (skipped in TESTING mode)
